{% extends 'tracker/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <h2 class="mb-4 text-center">Edit Expense</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Update Expense</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'dashboard' %}" class="text-decoration-none">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
