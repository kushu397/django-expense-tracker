{% extends 'tracker/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4 text-center">
            <h3 class="mb-3">Are you sure you want to delete "{{ expense.title }}"?</h3>
            <p class="text-muted">Amount: ${{ expense.amount }} on {{ expense.date }}</p>
            
            <form method="post" class="mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">Confirm Delete</button>
                <a href="{% url 'dashboard' %}" class="btn btn-secondary px-4 ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
